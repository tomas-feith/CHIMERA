[project]
name = "chimera"
version = "1.7.1"
description = "CHIMERA — a curve fitting and plotting desktop application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Feith" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "odrpack>=0.6.1",
    "openpyxl",
    "pandas",
    "pillow",
    "pymongo",
    "pyperclip",
    "requests",
]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "mypy>=2.3",
    "pandas-stubs",
    "pre-commit>=4.6.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-requests",
]

# CHIMERA is a single-file application, not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# The legacy single-file core is deliberately not reformatted -- doing so would
# produce an unreviewable diff across ~2.3k lines. `ruff check` still covers it.
# Declared here rather than as --exclude flags so CI, the pre-commit hook and a
# bare `ruff format` all agree without repeating the list.
exclude = ["main.py", "chimera_core.py"]

[tool.ruff.lint]
# Start from a pragmatic baseline for this legacy single-file app.
# pyflakes (F) catches real bugs (undefined names, unused imports); the rest
# are safe hygiene rules. Stylistic rules that would require churning the whole
# 4.8k-line file are deliberately left off for now and can be tightened later.
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # line-too-long: legacy file has many long lines
    "E741", # ambiguous variable names (l, I, O): used throughout legacy code
    "E701", # multiple statements on one line: pervasive legacy one-liner style
    "E721", # type comparison with '==': legacy read_file uses out == float/str
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into main.py's globals; that's expected.
"tests/*" = []

[tool.mypy]
python_version = "3.12"
# No blanket ignore_missing_imports: every dependency here either ships type
# information or has stubs in the dev group (pandas-stubs, types-requests).
# Removing it was a no-op for the error count and means an import that stops
# resolving -- a typo, or a module that moved -- now fails instead of passing.
warn_unused_ignores = true
warn_redundant_casts = true
# The legacy GUI module is untyped; type-check it leniently for now and
# enforce stricter typing on newly added code (e.g. tests, future modules).

# The legacy GUI modules reference each other's dynamically-set attributes and
# are untyped; type-check them leniently for now.
[[tool.mypy.overrides]]
module = ["main", "online_ui", "plotting", "project_io"]
ignore_errors = true

# The extracted pure modules are fully typed; require annotations there.
[[tool.mypy.overrides]]
module = ["chimera_core", "db", "expr_eval", "fitting"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing"
# For a targeted run that would trip the floor: uv run pytest -k foo --no-cov

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
# A ratchet, not an aspiration: currently ~43% (source only -- counting the
# test files themselves inflated this to 47%). Only catches regressions; raise
# it as tests land. The GUI-heavy modules (online_ui 12%, project_io 6%) are
# the thin ones; the pure modules are at 83-100%.
fail_under = 42
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
