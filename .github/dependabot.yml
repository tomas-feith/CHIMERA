version: 2

# Keeps CI action pins and Python deps from silently rotting.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    groups:
      # Dev tooling batched: a bad ruff or mypy bump is a lint diff, not a
      # behaviour change.
      dev-tools:
        dependency-type: development
        patterns:
          - "*"
      # Runtime PATCH bumps batched as well -- the high-volume, low-risk
      # majority. Minor and major runtime bumps stay individual so a matplotlib
      # or pymongo change that can move behaviour gets reviewed on its own.
      runtime-patch:
        dependency-type: production
        update-types:
          - patch
        patterns:
          - "*"
