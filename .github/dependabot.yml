version: 2

# Keeps CI action pins and Python deps from silently rotting.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # Dev tooling batched; runtime deps stay individual so a matplotlib or
      # pymongo bump gets reviewed on its own.
      dev-tools:
        dependency-type: development
        patterns:
          - "*"
