name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    # CHIMERA is a Tkinter desktop app whose users are on Windows, so the GUI
    # tests need to run there too -- previously they only ever ran under Xvfb.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Use a managed (python-build-standalone) interpreter rather than the
    # runner's system Python: importing main.py pulls in tkinter, which the
    # standalone build bundles but the system Python on the runner does not.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv stopped publishing moving major tags after v7.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check --exclude main.py --exclude chimera_core.py .

      - name: Mypy
        run: uv run mypy .

      # The headless GUI tests (tests/test_flows.py) construct a real Tk window.
      # Linux needs a virtual X server; Windows runners have a desktop session.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Pytest (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest

      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: gitleaks scans commits, not the worktree
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisation-owned repos.
